<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }}</title>
</head>
<body>
    <h1>Blogs</h1>
    {% for post in  posts %}
        <article>
            <h2>
                <a href="{{ url_for('blogs.blog_detail', slug=post.slug) }}">{{ post.title }}</a>
            </h2>
            <p>{{ post.description }}</p>
            <small>{{ post.date }}</small>
        </article>
    {% endfor %}
</body>
</html>
